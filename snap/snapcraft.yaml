name: sudoku
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-sudoku: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.sudoku # adjust accordingly to your app name

apps:
  sudoku:
    command: sudoku
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-sudoku
parts:
  sudoku:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
