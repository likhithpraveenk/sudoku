name: Build & Release Signed APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./pubspec.yaml
          cache: false

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build Signed APKs
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: "release.keystore"
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Remove Keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Rename APKs for Release
        run: |
          PREFIX="${{ github.event.repository.name }}-${{ github.ref_name }}"
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk "${PREFIX}-arm64.apk"
          mv app-armeabi-v7a-release.apk "${PREFIX}-armeabi.apk"
          mv app-x86_64-release.apk "${PREFIX}-x86_64.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          files: |
            build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
