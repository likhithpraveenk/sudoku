name: Build Android

on: workflow_call

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ./pubspec.yaml
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Patch Dart JNI for Reproducible Build
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt || true

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          keyAlias=${{ secrets.KEY_ALIAS }}
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storeFile=release.keystore
          EOF

      - name: Build Signed APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Remove Keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Rename APKs
        run: |
          PREFIX="sudoku-${{ github.ref_name }}"
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk   "${PREFIX}-android-arm64.apk"
          mv app-armeabi-v7a-release.apk "${PREFIX}-android-armeabi.apk"
          mv app-x86_64-release.apk      "${PREFIX}-android-x86_64.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/app/outputs/flutter-apk/*.apk
